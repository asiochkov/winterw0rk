services:
  winterwork:
    build:
      context: .
      # Baked into the client bundle; the build fails while they are unset.
      args:
        VITE_LEGAL_OPERATOR_NAME: ${VITE_LEGAL_OPERATOR_NAME:?set VITE_LEGAL_OPERATOR_NAME in .env}
        VITE_LEGAL_OPERATOR_LOCATION: ${VITE_LEGAL_OPERATOR_LOCATION:?set VITE_LEGAL_OPERATOR_LOCATION in .env}
        VITE_LEGAL_CONTACT_EMAIL: ${VITE_LEGAL_CONTACT_EMAIL:?set VITE_LEGAL_CONTACT_EMAIL in .env}
    restart: unless-stopped
    ports:
      - '${PORT:-8787}:8787'
    volumes:
      - winterwork-data:/data
    environment:
      NODE_ENV: production
      # Required — the server refuses to boot without these.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      # Optional. Leave empty to run without email; password reset then has to
      # be done with `npm run reset-password`. See DEPLOY.md.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Winterwork <no-reply@winterwork.app>}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
    # Give in-flight requests time to finish before SIGKILL.
    stop_grace_period: 15s

volumes:
  winterwork-data:
